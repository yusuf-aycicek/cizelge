[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cozucu"
version = "0.1.0"
description = "Okul ders programı çözücüsü (veritabanı ve web'den bağımsız)"
requires-python = ">=3.12"
dependencies = ["ortools>=9.15"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["slow: uzun süren testler (büyük veri seti, süre ölçümü)"]
addopts = "-m 'not slow'"
