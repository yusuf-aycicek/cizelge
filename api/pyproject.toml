[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "okulapi"
version = "0.1.0"
description = "Okul ders programı sistemi: API (modüler monolit, çekirdek + modüller)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sqlalchemy>=2.0.36",
    "psycopg[binary]>=3.2",
    "alembic>=1.14",
    "pydantic-settings>=2.6",
    # İş kuyruğu (ADR 0011). Yalnızca okulapi/cekirdek/kuyruk.py içe aktarır.
    "rq>=2.0",
    "redis>=5",
    # Parola özeti (ADR 0012).
    "argon2-cffi>=23.1",
    # Çıktı: PDF ve Excel (ADR 0020). Yalnızca moduller/ders_programi/cikti içe aktarır.
    "reportlab>=4.2",
    "openpyxl>=3.1",
    # Depodaki çözücü paketi (/cozucu). Ders programı modülü onu girdi/çıktı dönüşümü ve kısıt
    # doğrulaması için kullanır; çözücü API'yi bilmez. Geliştirmede: pip install -e ../cozucu
    "cozucu",
]

[project.optional-dependencies]
test = ["pytest>=8", "httpx>=0.27", "fakeredis>=2.26", "pypdf>=5"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"*" = ["*.mako", "*.ttf", "LICENSE_*.txt"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["uctan_uca: çalışan sisteme (docker compose up) HTTP ile bağlanan kabul testi"]
# Kabul testi varsayılan olarak çalışmaz (geliştirme veritabanına okul ekler); açıkça istenir:
#   pytest -m uctan_uca -s
addopts = "-m 'not uctan_uca'"
