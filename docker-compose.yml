# Bütün sistem tek komutla: docker compose up --build
# Servisler: db (PostgreSQL 17), redis (iş kuyruğu), api, worker, web (arayüz, Vite geliştirme sunucusu).

services:
  db:
    image: postgres:17
    environment:
      # Tablo sahibi rol: migration'lar bu rolle çalışır (bu imajda süper kullanıcıdır).
      # Uygulama ayrı, RLS'ye tabi `okul_uygulama` rolüyle bağlanır (init betiği oluşturur).
      POSTGRES_USER: okul_sahip
      POSTGRES_PASSWORD: okul_sahip  # yalnızca geliştirme; üretimde gizli değişkenden gelir
      POSTGRES_DB: okul
      OKUL_UYGULAMA_SIFRESI: okul_uygulama  # uygulama rolünün parolası (yalnızca geliştirme)
    ports:
      # Bilgisayardan erişim (testler, inceleme) 5433 üzerinden: aynı makinedeki başka projelerin
      # PostgreSQL konteynerleri 5432 kullanıyor. Konteynerler arası bağlantı yine db:5432.
      - "${DB_PORT:-5433}:5432"
    volumes:
      - db_verisi:/var/lib/postgresql/data  # konteyner silinse de veri kalır
      # İlk başlatmada uygulama rolünü oluşturan betik (yalnızca boş veri biriminde çalışır).
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U okul_sahip -d okul"]
      interval: 2s
      timeout: 3s
      retries: 30

  redis:
    # İş kuyruğu (RQ). Bilgisayara port açılmaz (docs/kuyruk-plani.md karar g): yalnızca api ve
    # worker konteynerleri redis:6379 ile ulaşır. Kalıcı birim yok: Redis silinirse kuyruktaki
    # işler kaybolur; programları ilk okumada "öksüz" olarak kapanır (ADR 0011 madde 8).
    image: redis:7.4
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 2s
      timeout: 3s
      retries: 30

  api:
    build:
      context: .
      dockerfile: api/Dockerfile
    environment:
      # Uygulama RLS'ye tabi rolle, migration'lar tablo sahibi rolle bağlanır.
      OKULAPI_VERITABANI_URL: postgresql+psycopg://okul_uygulama:okul_uygulama@db:5432/okul
      OKULAPI_MIGRASYON_URL: postgresql+psycopg://okul_sahip:okul_sahip@db:5432/okul
      OKULAPI_REDIS_URL: redis://redis:6379/0
      # Yerel geliştirme (ADR 0013): http üzerinden çalışılır, çerez Secure değildir. Yayında
      # bu satır olmaz (varsayılan: Secure açık).
      OKULAPI_CEREZ_SECURE: "false"
      # Veri değiştiren isteklerde kabul edilen kökenler: Vite geliştirme sunucusu (arayüz, /api
      # isteklerini buraya yönlendirir) ve API'nin kendi belge sayfası (/docs).
      # Port .env ile değiştirilirse (WEB_PORT, API_PORT) kökenler de onları izler.
      OKULAPI_IZINLI_KOKENLER: '["http://localhost:${WEB_PORT:-5173}", "http://localhost:${API_PORT:-8000}"]'
      # "Demo ile dene" düğmesi (ADR 0027): varsayılan kapalı. Yerelde denemek için .env'e
      # OKULAPI_DEMO_PAROLA yazılır ve `docker compose exec api python -m okulapi demo-okul` çalıştırılır.
      OKULAPI_DEMO_PAROLA: ${OKULAPI_DEMO_PAROLA:-}
    depends_on:
      db:
        condition: service_healthy  # veritabanı bağlantı kabul etmeden api başlamaz
      redis:
        condition: service_healthy
    # Önce migration'lar (bütün dallar en son haline), sonra uygulama.
    command: >
      sh -c "python -m okulapi.migrasyon upgrade heads &&
             uvicorn okulapi.main:uygulama_olustur --factory --host 0.0.0.0 --port 8000"
    ports:
      - "${API_PORT:-8000}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/saglik')"]
      interval: 5s
      timeout: 3s
      retries: 10

  worker:
    # API ile aynı imaj, farklı komut: kuyruktaki program üretme işlerini çalıştırır.
    build:
      context: .
      dockerfile: api/Dockerfile
    command: python -m okulworker
    environment:
      # Worker da RLS'ye tabi uygulama rolüyle bağlanır (ADR 0011 madde 10).
      OKULAPI_VERITABANI_URL: postgresql+psycopg://okul_uygulama:okul_uygulama@db:5432/okul
      OKULAPI_REDIS_URL: redis://redis:6379/0
    depends_on:
      redis:
        condition: service_healthy
      api:
        condition: service_healthy  # migration'ları api uygular; worker tablolar hazır olunca başlar
    # Ölçek: docker compose up --scale worker=3 (aynı iş iki kez yapılmaz, ADR 0011 madde 5).

  web:
    # Arayüz (React, Vite geliştirme sunucusu): http://localhost:5173. Tarayıcı yalnızca bunu görür;
    # Vite /api isteklerini api konteynerine iletir (aynı köken, ADR 0013).
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci --no-audit --no-fund && npm run dev -- --host 0.0.0.0"
    environment:
      VITE_API_HEDEF: http://api:8000
      WEB_YOKLAMA: "1"  # Windows'tan bağlanan klasörde dosya değişikliği yoklamayla izlenir
    volumes:
      - ./web:/app
      # Paketler konteynerin kendi biriminde: bilgisayardaki (Windows) node_modules kullanılmaz.
      - web_paketleri:/app/node_modules
    ports:
      - "${WEB_PORT:-5173}:5173"
    # Arayüz hazır mı: Vite sayfayı veriyor mu. İlk açılışta npm ci birkaç dakika sürebilir;
    # start_period boyunca başarısızlık sayılmaz. `docker compose up --wait` bu yüzden arayüz
    # açılana kadar bekler. 127.0.0.1: alpine'daki wget localhost'u önce IPv6'ya çözer.
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:5173/"]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 300s
    depends_on:
      api:
        condition: service_healthy

volumes:
  db_verisi:
  web_paketleri:
